name: Release APK

# 서명된 release APK 를 만들어 GitHub Release 에 첨부합니다.
# earlln.com 다운로드 링크(항상 최신): https://github.com/earlln/EarllnOverlay-app/releases/latest/download/EarllnOverlay.apk
#
# 실행 방법 (둘 중 하나)
#   - Actions 탭 → Release APK → Run workflow  (app/build.gradle 의 versionName 으로 v<버전> 태그를 만듭니다)
#   - v<버전> 태그 푸시 (예: git tag v1.1.0 && git push origin v1.1.0) — 태그와 versionName 이 같아야 합니다
#
# 최초 1회 — 저장소 Settings → Secrets and variables → Actions → New repository secret
#   RELEASE_KEYSTORE_BASE64   서명 키(.jks) 파일을 base64 로 바꾼 문자열
#   RELEASE_KEYSTORE_PASSWORD 키스토어 비밀번호
#   RELEASE_KEY_ALIAS         키 별칭
#   RELEASE_KEY_PASSWORD      키 비밀번호
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Wrapper 준비
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew" -o gradlew
          curl -fsSL "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: 버전과 태그 확인
        id: version
        run: |
          NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\(.*\)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$NAME" ]; then echo "::error::app/build.gradle 에서 versionName 을 찾지 못했습니다."; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v$NAME" ]; then
              echo "::error::태그($TAG)와 versionName(v$NAME)이 다릅니다. app/build.gradle 의 versionName 을 먼저 올리세요."
              exit 1
            fi
          else
            TAG="v$NAME"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG 릴리즈가 이미 있습니다. app/build.gradle 의 versionName 을 올린 뒤 다시 실행하세요."
              exit 1
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 서명 키 복원
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret 이 없습니다. 고정 서명 없이는 업데이트 설치가 안 되므로 릴리즈를 중단합니다."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 단위 테스트
        run: ./gradlew --no-daemon testReleaseUnitTest --stacktrace

      - name: 서명된 Release APK 빌드
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # 디버그 빌드(build.yml) 번호보다 항상 크도록 1000 을 더합니다
          export VERSION_CODE=$(( ${{ github.run_number }} + 1000 ))
          ./gradlew --no-daemon assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk EarllnOverlay.apk
          # 서명 확인 (서명되지 않았으면 실패)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs EarllnOverlay.apk

      - name: GitHub Release 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: EarllnOverlay ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: EarllnOverlay.apk
          generate_release_notes: true
          body: |
            실시간 영→한 자막 노트 (안드로이드 8.0 이상)

            ## 설치 방법
            1. 아래 `EarllnOverlay.apk` 를 휴대폰에서 내려받아 설치합니다 (출처를 알 수 없는 앱 설치 허용 필요).
            2. 앱에서 **▶ 자막 시작** → 권한 요청은 모두 허용합니다.
            3. 처음 한 번 음성 인식·번역 모델을 내려받습니다 (약 70~160MB, Wi-Fi 권장).

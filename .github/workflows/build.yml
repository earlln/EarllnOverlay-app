name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Gradle Wrapper JAR 다운로드
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: gradlew 실행권한 부여
        run: chmod +x gradlew

      - name: Debug APK 빌드
        run: ./gradlew assembleDebug --stacktrace

      - name: APK 업로드 (다운로드 가능)
        uses: actions/upload-artifact@v4
        with:
          name: SubOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

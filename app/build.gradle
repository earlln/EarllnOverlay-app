plugins {
    id 'com.android.application'
}

android {
    namespace 'com.earlln.overlay'
    compileSdk 34

    defaultConfig {
        applicationId "com.earlln.overlay"
        minSdk 26
        targetSdk 34
        // 빌드 번호 = GitHub Actions 실행 번호 (로컬 빌드는 1)
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Google MLKit 번역 (온디바이스)
    implementation 'com.google.mlkit:translate:17.0.2'

    // Google MLKit 글자 인식 (온디바이스, 영어/라틴 문자 모델 포함)
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Vosk 오프라인 STT (SpeechRecognizer 대체 → 오디오 포커스 충돌 없음)
    implementation 'com.alphacephei:vosk-android:0.3.47'

    // 온라인 음성 인식(Deepgram) WebSocket 스트리밍
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.earlln.overlay'
    compileSdk 34

    defaultConfig {
        applicationId "com.earlln.overlay"
        minSdk 26
        targetSdk 34
        // 빌드 번호 = GitHub Actions 실행 번호 (로컬 빌드는 1)
        // 릴리즈 워크플로는 VERSION_CODE 를 직접 넘깁니다 (디버그 빌드 번호보다 항상 크게)
        versionCode((System.getenv("VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        // 릴리즈 태그는 v + 이 값입니다 (예: v1.1.0)
        versionName "1.1.0"
    }

    // 공개 배포용 고정 서명 — 키가 바뀌면 사용자가 앱을 지우고 다시 깔아야 하므로 항상 같은 키를 씁니다.
    // 키 파일과 비밀번호는 저장소에 두지 않고 GitHub Secrets 로만 받습니다 (.github/workflows/release.yml).
    def releaseKeystore = System.getenv("RELEASE_KEYSTORE_FILE")
    signingConfigs {
        if (releaseKeystore && file(releaseKeystore).exists()) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.findByName("release")
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Google MLKit 번역 (온디바이스)
    implementation 'com.google.mlkit:translate:17.0.2'

    // Google MLKit 글자 인식 (온디바이스, 영어/라틴 문자 모델 포함)
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Vosk 오프라인 STT (SpeechRecognizer 대체 → 오디오 포커스 충돌 없음)
    implementation 'com.alphacephei:vosk-android:0.3.47'

    testImplementation 'junit:junit:4.13.2'
}
